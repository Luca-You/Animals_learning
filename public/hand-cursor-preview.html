<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Cursor Preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #f2fbff, #dff1ff 60%, #d8ecfb);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }
      .card {
        background: rgba(255, 255, 255, 0.72);
        border: 2px solid rgba(69, 151, 189, 0.35);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 12px 30px rgba(31, 127, 165, 0.2);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas id="hand" width="320" height="320"></canvas>
    </div>
    <script>
      const canvas = document.getElementById("hand");
      const ctx = canvas.getContext("2d");
      const scale = 2.2;

      const fillRoundRect = (x, y, width, height, radius) => {
        const r = Math.min(radius, width * 0.5, height * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
      };

      ctx.save();
      ctx.translate(38, 36);
      ctx.scale(scale, scale);
      ctx.clearRect(0, 0, 110, 110);

      const glow = ctx.createRadialGradient(55, 56, 12, 55, 56, 52);
      glow.addColorStop(0, "rgba(255, 255, 255, 0.95)");
      glow.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(55, 56, 52, 0, Math.PI * 2);
      ctx.fill();

      const outline = "#1f7fa5";
      const fingerLight = "#fff7ee";
      const fingerBase = "#fff0df";
      const palmLight = "#fff7ec";
      const palmBase = "#ffe8d2";
      const padTone = "#ffdabb";

      const drawFinger = (x, y, width, height, angleDeg) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((angleDeg * Math.PI) / 180);
        ctx.fillStyle = fingerBase;
        fillRoundRect(-width * 0.5, -height, width, height, width * 0.42);
        ctx.stroke();
        ctx.fillStyle = fingerLight;
        fillRoundRect(-width * 0.38, -height + 4, width * 0.76, height * 0.62, width * 0.28);
        ctx.restore();
      };

      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      drawFinger(37, 50, 11, 28, -16);
      drawFinger(49, 45, 11, 33, -8);
      drawFinger(61, 44, 11, 34, 5);
      drawFinger(73, 49, 11, 29, 14);

      const palmGradient = ctx.createLinearGradient(33, 44, 74, 86);
      palmGradient.addColorStop(0, palmLight);
      palmGradient.addColorStop(1, palmBase);
      ctx.fillStyle = palmGradient;
      fillRoundRect(34, 44, 42, 41, 15);
      ctx.stroke();

      ctx.fillStyle = fingerBase;
      ctx.beginPath();
      ctx.moveTo(34, 64);
      ctx.bezierCurveTo(24, 58, 18, 64, 17, 73);
      ctx.bezierCurveTo(16, 80, 20, 86, 27, 87);
      ctx.bezierCurveTo(33, 88, 37, 84, 39, 78);
      ctx.bezierCurveTo(41, 72, 40, 67, 34, 64);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = padTone;
      ctx.beginPath();
      ctx.ellipse(56, 67, 9.6, 7.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff8ef";
      ctx.beginPath();
      ctx.ellipse(50, 61, 3.8, 2.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    </script>
  </body>
</html>
